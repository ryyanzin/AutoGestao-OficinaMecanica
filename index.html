<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d292d">
  <meta name="description" content="AutoGestão — controle de clientes, veículos, serviços e equipe da oficina.">
  <title>AutoGestão | Gestão da Oficina</title>
  <style>
    :root {
      --sidebar: #1d292d;
      --sidebar-soft: #2a393e;
      --sidebar-text: #b6c2c4;
      --accent: #c8794c;
      --accent-deep: #a96038;
      --bg: #f5f6f4;
      --surface: #ffffff;
      --surface-alt: #fafbfa;
      --ink: #202d30;
      --muted: #788487;
      --border: #e2e7e5;
      --border-strong: #ccd6d3;
      --green: #39785b;
      --green-bg: #e9f2ec;
      --red: #b04d4a;
      --shadow: 0 2px 8px rgba(27, 44, 45, .025);
      --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      font-synthesis: none;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: var(--bg); font-size: 14px; line-height: 1.48; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .42; cursor: not-allowed; }
    :focus-visible { outline: 3px solid rgba(200, 121, 76, .5); outline-offset: 3px; }
    button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

    /* Navegação lateral */
    .sidebar { position: sticky; top: 0; height: 100vh; background: var(--sidebar); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 32px 15px 21px; overflow-y: auto; z-index: 30; }
    .brand { display: flex; align-items: center; gap: 13px; padding: 0 13px 33px; border-bottom: 1px solid rgba(255,255,255,.095); }
    .brand-mark { width: 39px; height: 39px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.22); border-left: 3px solid var(--accent); color: #f4f5f3; font-size: 15px; font-weight: 800; letter-spacing: -1px; flex-shrink: 0; }
    .brand strong { display: block; color: #f6f7f4; font-size: 19px; letter-spacing: -.75px; line-height: 1.15; font-weight: 750; }
    .brand small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1.9px; margin-top: 6px; color: #8ca0a3; }
    .nav-group { margin-top: 33px; }
    .nav-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.75px; color: #7f9296; padding: 0 15px; margin-bottom: 11px; }
    .nav { display: grid; gap: 5px; }
    .nav button { width: 100%; background: transparent; border: 0; color: #b8c5c7; text-align: left; min-height: 44px; border-radius: 5px; padding: 11px 13px; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: background .18s, color .18s; position: relative; }
    .nav button:hover { background: rgba(255,255,255,.065); color: #fff; }
    .nav button.active { color: #fff; background: var(--sidebar-soft); font-weight: 650; }
    .nav button.active::before { content: ""; position: absolute; width: 3px; height: 19px; left: 0; top: 50%; transform: translateY(-50%); background: var(--accent); border-radius: 0 2px 2px 0; }
    .nav svg { width: 18px; height: 18px; flex: 0 0 auto; stroke-width: 1.7; }
    .sidebar-foot { margin-top: auto; padding: 22px 13px 2px; border-top: 1px solid rgba(255,255,255,.095); }
    .sidebar-foot span { display: block; font-size: 10px; letter-spacing: 1.3px; text-transform: uppercase; color: #7f9296; margin-bottom: 9px; font-weight: 700; }
    .sidebar-foot p { margin: 0; font-size: 12px; color: #b8c5c7; display: flex; align-items: center; gap: 8px; }
    .sidebar-foot p::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #73aa8e; }
    .menu-backdrop { display: none; }

    /* Área principal */
    .main { min-width: 0; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); min-height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(22px, 3.7vw, 56px); gap: 20px; }
    .top-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .breadcrumb { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #929da0; }
    .breadcrumb b { color: #46575b; font-weight: 650; }
    .breadcrumb-divider { color: #c8d0ce; }
    .topbar-right { display: flex; align-items: center; gap: 17px; color: var(--muted); font-size: 12px; }
    .today { white-space: nowrap; }
    .topbar-separator { width: 1px; height: 19px; background: var(--border); }
    .saved-indicator { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .saved-indicator::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4d9b76; box-shadow: 0 0 0 3px #eaf5ee; }
    .content { max-width: 1530px; margin: 0 auto; padding: 42px clamp(22px, 3.7vw, 56px) 68px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; margin-bottom: 29px; }
    .eyebrow { color: var(--accent-deep); font-size: 10px; font-weight: 750; letter-spacing: 1.8px; text-transform: uppercase; margin-bottom: 10px; }
    .page-head h1 { font-size: clamp(27px, 3vw, 36px); font-weight: 720; letter-spacing: -1.25px; line-height: 1.15; margin: 0; }
    .page-head p { margin: 9px 0 0; font-size: 13px; color: var(--muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--border-strong); background: #fff; color: #34454a; padding: 10px 15px; min-height: 39px; border-radius: 5px; font-size: 12px; font-weight: 650; line-height: 1.2; text-align: center; transition: background .15s, border-color .15s; }
    .btn:hover { background: #f7f9f8; border-color: #aebdb9; }
    .btn-primary { background: #253e42; border-color: #253e42; color: #fff; }
    .btn-primary:hover { background: #355358; border-color: #355358; }
    .btn-danger { color: var(--red); border-color: #e7c5c3; }
    .btn-danger:hover { background: #fff5f4; border-color: #d69e9b; }
    .btn-small { padding: 7px 10px; min-height: 31px; font-size: 11px; }
    .btn svg { width: 15px; height: 15px; }
    .btn-menu { display: none; padding: 8px; min-height: 36px; width: 36px; }

    /* Indicadores e painéis */
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 15px; margin-bottom: 22px; }
    .stat { background: var(--surface); padding: 22px 23px 20px; border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); }
    .stat-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .stat-label { font-size: 12px; color: #5e7074; font-weight: 600; }
    .stat-icon { border: 1px solid #e9eeec; background: #f6f8f7; width: 30px; height: 30px; display: grid; place-items: center; color: #809294; border-radius: 5px; }
    .stat-icon svg { width: 15px; height: 15px; }
    .stat strong { display: block; margin: 17px 0 3px; font-size: 32px; line-height: 1.06; font-weight: 730; letter-spacing: -1.2px; font-variant-numeric: tabular-nums; }
    .stat small { font-size: 11px; color: #8b989a; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
    .panel-header { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 20px 24px; border-bottom: 1px solid var(--border); }
    .panel-header h2 { margin: 0; color: #263638; font-size: 15px; font-weight: 690; letter-spacing: -.25px; }
    .panel-header p { color: var(--muted); font-size: 11px; margin: 5px 0 0; }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
    .quick { padding: 8px 24px; }
    .quick button { display: flex; width: 100%; align-items: center; justify-content: space-between; text-align: left; padding: 18px 1px; background: none; border: 0; border-bottom: 1px solid var(--border); color: #35474a; font-size: 13px; font-weight: 550; gap: 15px; }
    .quick button:last-child { border-bottom: 0; }
    .quick button:hover { color: var(--accent-deep); }
    .quick .arrow { color: #a1adae; font-size: 17px; font-weight: 400; }
    .activity { padding: 6px 24px; }
    .activity-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 65px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .activity-row:last-child { border-bottom: 0; }
    .activity-main { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .activity-type { width: 35px; height: 35px; border: 1px solid #e5eae8; background: #f6f8f7; border-radius: 5px; display: grid; place-items: center; flex: 0 0 auto; color: #778c8c; }
    .activity-type svg { width: 16px; height: 16px; }
    .activity-text { min-width: 0; }
    .activity-text strong { display: block; font-weight: 620; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px; }
    .activity-text small { color: var(--muted); font-size: 10px; }
    .activity-row time { color: var(--muted); white-space: nowrap; font-size: 11px; }
    .footer-note { font-size: 11px; color: var(--muted); margin: 21px 0 0; }

    /* Cadastros */
    .two-col { display: grid; grid-template-columns: minmax(290px, 356px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .form-body { padding: 24px; display: grid; gap: 19px; }
    .field { display: grid; gap: 7px; min-width: 0; }
    .field label { font-size: 12px; color: #46595b; font-weight: 650; }
    .field label span { color: var(--accent); }
    .field input, .field select, .field textarea { display: block; width: 100%; border: 1px solid #d5ddda; border-radius: 5px; color: #263638; background: #fff; min-height: 42px; padding: 10px 11px; outline: 0; font-size: 13px; transition: border-color .16s, box-shadow .16s; }
    .field textarea { min-height: 125px; resize: vertical; line-height: 1.55; }
    .field input::placeholder, .field textarea::placeholder { color: #a6b0b1; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #739895; box-shadow: 0 0 0 3px #e9f0ed; }
    .field select { padding-right: 10px; }
    .form-actions { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 9px; }
    .form-actions .btn-primary { flex: 1 1 auto; }
    .search-wrap { position: relative; width: min(230px, 100%); min-width: 150px; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #9ba8a8; width: 15px; height: 15px; }
    .search { border: 1px solid #d8e0dc; width: 100%; height: 36px; border-radius: 5px; padding: 8px 10px 8px 34px; outline: none; font-size: 12px; color: var(--ink); background: #fff; }
    .search:focus { border-color: #739895; box-shadow: 0 0 0 3px #e9f0ed; }
    .search::placeholder { color: #a1aeae; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { padding: 14px 18px; color: #809092; background: #fafbfa; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .75px; white-space: nowrap; }
    td { border-top: 1px solid #edf1ee; padding: 16px 18px; vertical-align: middle; max-width: 360px; overflow-wrap: anywhere; color: #4e6063; }
    tbody tr:hover { background: #fbfcfb; }
    .primary-cell { font-weight: 675; font-size: 12px; color: #253638; }
    .table-actions { display: flex; align-items: center; gap: 7px; }
    .plate { color: #3d5255; border: 1px solid #d7dfdc; background: #f7f9f8; display: inline-block; padding: 5px 8px; border-radius: 4px; font-family: Consolas, "Courier New", monospace; font-weight: 700; font-size: 11px; letter-spacing: .6px; white-space: nowrap; }
    .empty { padding: 65px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .empty-symbol { width: 50px; height: 50px; display: grid; place-items: center; border: 1px solid #e4ebe7; border-radius: 50%; color: #9dada9; margin-bottom: 17px; background: #fafbfa; }
    .empty-symbol svg { width: 22px; height: 22px; stroke-width: 1.4; }
    .empty strong { font-size: 13px; color: #34484a; margin-bottom: 5px; font-weight: 650; }
    .empty p { max-width: 250px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .notice { background: #faf6f0; border: 1px solid #ecddca; border-radius: 5px; color: #806544; padding: 13px 15px; font-size: 12px; line-height: 1.6; margin: 0 0 20px; }
    .form-body .notice { margin: 0; }

    /* Arquivos */
    .json-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .json-box { padding: 24px; }
    .json-box h3 { font-size: 14px; font-weight: 650; margin: 0 0 8px; }
    .json-box p { color: var(--muted); line-height: 1.65; font-size: 12px; min-height: 59px; margin: 0 0 23px; }
    .json-box input[type=file] { display: block; max-width: 100%; border: 1px dashed var(--border-strong); background: #fbfcfb; padding: 12px; border-radius: 5px; font-size: 11px; margin: 8px 0 15px; }
    .danger-zone { display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 25px; }
    .danger-zone strong { font-size: 13px; color: #3b4b4c; }
    .danger-zone p { font-size: 11px; line-height: 1.6; color: var(--muted); margin: 5px 0 0; }
    .storage-detail { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 24px; padding: 17px 18px; border-radius: 5px; background: #f0f4f1; border: 1px solid #e0e8e2; color: #496459; font-size: 12px; line-height: 1.6; }
    .storage-detail svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 1px; }
    .storage-detail strong { display: block; color: #36584b; margin-bottom: 2px; }
    .toast { position: fixed; z-index: 50; bottom: 24px; right: 25px; max-width: min(420px, calc(100vw - 32px)); color: white; background: #25433b; box-shadow: 0 10px 28px rgba(0,0,0,.16); padding: 13px 18px; border-radius: 5px; font-size: 12px; line-height: 1.5; }
    .toast.error { background: #853b36; }

    @media (max-width: 1180px) {
      .app { grid-template-columns: 220px minmax(0,1fr); }
      .sidebar { padding-inline: 11px; }
      .two-col { grid-template-columns: 1fr; }
      .overview-grid { grid-template-columns: 1fr; }
      .topbar { padding-inline: 27px; }
      .content { padding-inline: 27px; }
    }
    @media (max-width: 820px) {
      .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .topbar-right .today, .topbar-separator { display: none; }
      .json-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .app { display: block; }
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: min(285px, 85vw); height: 100dvh; transform: translateX(-104%); transition: transform .2s ease; box-shadow: none; }
      .sidebar.open { transform: translateX(0); box-shadow: 16px 0 35px rgba(0,0,0,.24); }
      .menu-backdrop.open { display: block; position: fixed; z-index: 20; inset: 0; background: rgba(18,30,33,.5); }
      .btn-menu { display: inline-flex; }
      .topbar { min-height: 62px; padding-inline: 16px; }
      .breadcrumb { font-size: 11px; }
      .topbar-right { font-size: 10px; }
      .content { padding: 29px 15px 50px; }
      .page-head { margin-bottom: 23px; }
      .page-head h1 { font-size: 29px; }
      .stats { gap: 10px; margin-bottom: 16px; }
      .stat { padding: 17px; }
      .stat strong { font-size: 28px; margin-top: 13px; }
      .stat-icon { width: 26px; height: 26px; }
      .overview-grid, .two-col { gap: 15px; }
      .panel-header { padding: 17px; min-height: 70px; }
      .form-body { padding: 18px; }
      .quick { padding-inline: 18px; }
      .activity { padding-inline: 18px; }
      .json-box { padding: 18px; }
      .panel-header.search-header { flex-wrap: wrap; }
      .search-wrap { width: 100%; }
      .danger-zone { padding: 19px; align-items: flex-start; flex-direction: column; }
      .toast { bottom: 16px; right: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
    <div class="brand"><span class="brand-mark" aria-hidden="true">AG</span><div><strong>AutoGestão</strong><small>Gestão de oficina</small></div></div>
    <div class="nav-group">
      <div class="nav-label">Área de trabalho</div>
      <nav class="nav" id="nav" aria-label="Seções do sistema">
        <button type="button" data-page="inicio" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Visão geral</button>
        <button type="button" data-page="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg> Clientes</button>
        <button type="button" data-page="veiculos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m5 17-1 2v2h3v-2h10v2h3v-2l-1-2"/><path d="M5 17H3v-5l2-2 2-6h10l2 6 2 2v5H5Z"/><path d="M5 10h14M7 14h2m6 0h2"/></svg> Veículos</button>
        <button type="button" data-page="servicos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18a2.1 2.1 0 0 0 3 3l5.3-5.3a5 5 0 0 0 6.4-6.4l-3.6 3.6-3.6-3.6 3.6-3.6Z"/></svg> Serviços</button>
        <button type="button" data-page="funcionarios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3H3Zm14-11a3 3 0 1 0-1-5.83M18 14a5 5 0 0 1 3 4.6V21h-4"/></svg> Funcionários</button>
        <button type="button" data-page="dados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v7c0 1.66 4.03 3 9 3s9-1.34 9-3V5M3 12v7c0 1.66 4.03 3 9 3s9-1.34 9-3v-7"/></svg> Dados e backup</button>
      </nav>
    </div>
    <div class="sidebar-foot"><span>Armazenamento</span><p>Dados neste navegador</p></div>
  </aside>
  <div class="menu-backdrop" id="menu-backdrop" aria-hidden="true"></div>
  <div class="main">
    <header class="topbar">
      <div class="top-left"><button type="button" class="btn btn-menu" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><div class="breadcrumb"><span>AutoGestão</span><span class="breadcrumb-divider">/</span><b id="breadcrumb">Visão geral</b></div></div>
      <div class="topbar-right"><span class="today" id="today"></span><span class="topbar-separator"></span><span class="saved-indicator">Dados locais</span></div>
    </header>
    <main class="content" id="content" aria-live="off"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';

// Os dados permanecem disponíveis neste navegador mesmo depois de fechar a página.
const KEY = 'autogestao.v1';
const LEGACY_KEY = 'oficina.clientes';
const $ = id => document.getElementById(id);
const empty = () => ({ clientes: [], veiculos: [], servicos: [], funcionarios: [] });
const uid = () => 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = value => String(value ?? '').replace(/\D/g, '');
const phone = value => { const d = digits(value); return d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; };
const plate = value => String(value ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const fmtPlate = value => { const p = plate(value); return /^[A-Z]{3}[0-9]{4}$/.test(p) ? p.slice(0, 3) + '-' + p.slice(3) : p; };
const dateText = value => { const d = new Date(value); return !value || Number.isNaN(d.getTime()) ? '—' : d.toLocaleDateString('pt-BR'); };

function read() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && typeof data === 'object') {
        return Object.fromEntries(Object.keys(empty()).map(k => [k, Array.isArray(data[k]) ? data[k] : []]));
      }
    }
    const old = localStorage.getItem(LEGACY_KEY);
    if (old) {
      const list = JSON.parse(old);
      if (Array.isArray(list)) {
        const data = empty();
        data.clientes = list.filter(x => x && typeof x === 'object').map(x => ({
          id: uid(), nome: String(x.nome ?? ''), telefone: String(x.telefone ?? ''), endereco: String(x.endereco ?? '')
        }));
        localStorage.setItem(KEY, JSON.stringify(data));
        return data;
      }
    }
  } catch (error) {
    console.error('Não foi possível carregar os cadastros:', error);
  }
  return empty();
}

let db = read();
let page = 'inicio';
let editing = null;
let query = '';
let toastTimeout;

function notify(message, error = false) {
  const toast = $('toast');
  toast.textContent = message;
  toast.className = 'toast' + (error ? ' error' : '');
  toast.hidden = false;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.hidden = true, 4500);
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
    return true;
  } catch (error) {
    console.error(error);
    notify('Não foi possível salvar os dados neste navegador.', true);
    return false;
  }
}
const names = { inicio: 'Visão geral', clientes: 'Clientes', veiculos: 'Veículos', servicos: 'Serviços', funcionarios: 'Funcionários', dados: 'Dados e backup' };

function closeMenu() {
  $('sidebar').classList.remove('open');
  $('menu-backdrop').classList.remove('open');
  $('menu-toggle').setAttribute('aria-expanded', 'false');
}
function go(target) {
  if (!names[target]) return;
  page = target;
  editing = null;
  query = '';
  closeMenu();
  document.querySelectorAll('#nav button').forEach(button => {
    const active = button.dataset.page === target;
    button.classList.toggle('active', active);
    if (active) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
  $('breadcrumb').textContent = names[target];
  render();
  window.scrollTo(0, 0);
}

const icon = (name, cssClass = '') => {
  const icons = {
    users: '<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2H3Zm14-11a3 3 0 0 0-1-5.8M18 14a5 5 0 0 1 3 4.6V20h-4"/>',
    car: '<path d="m5 17-1 2v2h3v-2h10v2h3v-2l-1-2"/><path d="M5 17H3v-5l2-2 2-6h10l2 6 2 2v5H5Z"/><path d="M5 10h14M7 14h2m6 0h2"/>',
    wrench: '<path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18a2.1 2.1 0 0 0 3 3l5.3-5.3a5 5 0 0 0 6.4-6.4l-3.6 3.6-3.6-3.6 3.6-3.6Z"/>',
    user: '<circle cx="12" cy="7.5" r="3.5"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
    search: '<circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/>',
    inbox: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h5l2 3h4l2-3h5"/>',
    download: '<path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/>',
    upload: '<path d="M12 17V5m-4 4 4-4 4 4M4 17v3h16v-3"/>',

  };
  return `<svg class="${cssClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] ?? icons.inbox}</svg>`;
};
const heading = (tag, title, subtitle) => `<header class="page-head"><div><div class="eyebrow">${escapeHTML(tag)}</div><h1>${escapeHTML(title)}</h1><p>${escapeHTML(subtitle)}</p></div></header>`;
const stat = (label, count, note, symbol) => `<article class="stat"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon">${icon(symbol)}</span></div><strong>${count}</strong><small>${note}</small></article>`;
const panel = (title, subtitle, body) => `<section class="panel"><div class="panel-header"><div><h2>${title}</h2>${subtitle ? `<p>${subtitle}</p>` : ''}</div></div>${body}</section>`;

function home() {
  const recent = [
    ...db.servicos.map(x => ({ type: 'Serviço', title: x.descricao, when: x.criadoEm, symbol: 'wrench' })),
    ...db.veiculos.map(x => ({ type: 'Veículo', title: `${x.marca} ${x.modelo}`, when: x.criadoEm, symbol: 'car' })),
    ...db.clientes.map(x => ({ type: 'Cliente', title: x.nome, when: x.criadoEm, symbol: 'user' })),
    ...db.funcionarios.map(x => ({ type: 'Funcionário', title: x.nome, when: x.criadoEm, symbol: 'users' }))
  ].sort((a, b) => new Date(b.when || 0) - new Date(a.when || 0)).slice(0, 6);
  const activity = recent.length ? `<div class="activity">${recent.map(item => `
    <div class="activity-row">
      <div class="activity-main"><span class="activity-type">${icon(item.symbol)}</span><span class="activity-text"><strong title="${escapeHTML(item.title)}">${escapeHTML(item.title)}</strong><small>${item.type}</small></span></div>
      <time>${dateText(item.when)}</time>
    </div>`).join('')}</div>` : emptyState('Nenhuma atividade registrada', 'Quando você começar a cadastrar, os registros aparecerão aqui.');
  return heading('Painel operacional', 'Visão geral', 'Um resumo dos registros da sua oficina.') + `
    <section class="stats" aria-label="Indicadores">
      ${stat('Clientes', db.clientes.length, 'Pessoas cadastradas', 'user')}
      ${stat('Veículos', db.veiculos.length, 'Veículos na base', 'car')}
      ${stat('Serviços', db.servicos.length, 'Serviços registrados', 'wrench')}
      ${stat('Funcionários', db.funcionarios.length, 'Pessoas na equipe', 'users')}
    </section>
    <div class="overview-grid">
      ${panel('Últimos registros', 'Atividades adicionadas recentemente', activity)}
      ${panel('Acesso rápido', 'Escolha por onde começar', `<div class="quick">
        <button type="button" data-go="clientes">Cadastrar cliente <span class="arrow">→</span></button>
        <button type="button" data-go="veiculos">Adicionar veículo <span class="arrow">→</span></button>
        <button type="button" data-go="servicos">Registrar serviço <span class="arrow">→</span></button>
        <button type="button" data-go="funcionarios">Cadastrar funcionário <span class="arrow">→</span></button>
      </div>`)}
    </div>
    <p class="footer-note">As informações são salvas neste navegador. Faça uma cópia de segurança em Dados e backup.</p>`;
}

const configs = {
  clientes: {
    tag: 'Cadastro', title: 'Clientes', subtitle: 'Dados de contato e endereço dos clientes.', single: 'cliente',
    fields: [['nome', 'Nome completo', 'text', 'Nome e sobrenome'], ['telefone', 'Telefone com DDD', 'tel', '(83) 99999-9999'], ['endereco', 'Endereço', 'text', 'Rua, número, bairro e cidade']],
    columns: ['Cliente', 'Telefone', 'Endereço']
  },
  veiculos: {
    tag: 'Cadastro', title: 'Veículos', subtitle: 'Identificação dos veículos e seus proprietários.', single: 'veículo',
    fields: [['marca', 'Marca', 'text', 'Ex.: Volkswagen'], ['modelo', 'Modelo', 'text', 'Ex.: Gol 1.6'], ['placa', 'Placa', 'text', 'ABC-1D23'], ['clienteId', 'Proprietário', 'select', '']],
    columns: ['Veículo', 'Placa', 'Proprietário']
  },
  servicos: {
    tag: 'Atendimentos', title: 'Serviços', subtitle: 'Histórico dos reparos realizados nos veículos.', single: 'serviço',
    fields: [['veiculoId', 'Veículo atendido', 'select', ''], ['descricao', 'Descrição do serviço', 'textarea', 'Descreva o que foi realizado no veículo']],
    columns: ['Serviço realizado', 'Veículo', 'Data']
  },
  funcionarios: {
    tag: 'Equipe', title: 'Funcionários', subtitle: 'Dados e funções dos colaboradores da oficina.', single: 'funcionário',
    fields: [['nome', 'Nome completo', 'text', 'Nome e sobrenome'], ['telefone', 'Telefone com DDD', 'tel', '(83) 99999-9999'], ['funcao', 'Função', 'text', 'Ex.: Mecânico']],
    columns: ['Funcionário', 'Telefone', 'Função']
  }
};

function fieldHTML(k, field, record) {
  const [id, label, type, placeholder] = field;
  const value = record?.[id] ?? '';
  let input;
  if (type === 'select') {
    const options = k === 'veiculos'
      ? db.clientes.map(x => [x.id, x.nome])
      : db.veiculos.map(x => [x.id, `${x.marca} ${x.modelo} · ${fmtPlate(x.placa)}`]);
    input = `<select id="f-${id}" name="${id}" required><option value="">Selecione uma opção</option>${options.map(([key, name]) => `<option value="${escapeHTML(key)}" ${key === value ? 'selected' : ''}>${escapeHTML(name)}</option>`).join('')}</select>`;
  } else if (type === 'textarea') {
    input = `<textarea id="f-${id}" name="${id}" maxlength="500" placeholder="${escapeHTML(placeholder)}" required>${escapeHTML(value)}</textarea>`;
  } else {
    input = `<input id="f-${id}" name="${id}" type="${type}" value="${escapeHTML(value)}" placeholder="${escapeHTML(placeholder)}" maxlength="${id === 'placa' ? 8 : 120}" ${id === 'placa' ? 'style="text-transform: uppercase"' : ''} ${id === 'telefone' ? 'inputmode="tel"' : ''} autocomplete="off" required>`;
  }
  return `<div class="field"><label for="f-${id}">${label} <span aria-hidden="true">*</span></label>${input}</div>`;
}
function rowHTML(k, record) {
  let cells = [];
  if (k === 'clientes') {
    cells = [`<div class="primary-cell">${escapeHTML(record.nome)}</div>`, escapeHTML(record.telefone), escapeHTML(record.endereco)];
  } else if (k === 'veiculos') {
    const owner = db.clientes.find(x => x.id === record.clienteId);
    cells = [`<div class="primary-cell">${escapeHTML(record.marca)} ${escapeHTML(record.modelo)}</div>`, `<span class="plate">${escapeHTML(fmtPlate(record.placa))}</span>`, escapeHTML(owner?.nome || 'Proprietário não encontrado')];
  } else if (k === 'servicos') {
    const vehicle = db.veiculos.find(x => x.id === record.veiculoId);
    cells = [`<div class="primary-cell">${escapeHTML(record.descricao)}</div>`, vehicle ? escapeHTML(`${vehicle.marca} ${vehicle.modelo} · ${fmtPlate(vehicle.placa)}`) : 'Veículo não encontrado', dateText(record.criadoEm)];
  } else if (k === 'funcionarios') {
    cells = [`<div class="primary-cell">${escapeHTML(record.nome)}</div>`, escapeHTML(record.telefone), escapeHTML(record.funcao)];
  }
  return `<tr>${cells.map(cell => `<td>${cell}</td>`).join('')}<td><div class="table-actions">${k === 'clientes' ? `<button class="btn btn-small" type="button" data-edit="${escapeHTML(record.id)}">Editar</button>` : ''}<button class="btn btn-small btn-danger" type="button" data-delete="${escapeHTML(record.id)}">Excluir</button></div></td></tr>`;
}
function emptyState(title, subtitle) {
  return `<div class="empty"><span class="empty-symbol">${icon('inbox')}</span><strong>${title}</strong><p>${subtitle}</p></div>`;
}
function searchableText(k, record) {
  const parts = Object.values(record).map(String);
  if (k === 'veiculos') {
    parts.push(db.clientes.find(x => x.id === record.clienteId)?.nome || '');
  }
  if (k === 'servicos') {
    const vehicle = db.veiculos.find(x => x.id === record.veiculoId);
    if (vehicle) parts.push(vehicle.marca, vehicle.modelo, fmtPlate(vehicle.placa));
  }
  return parts.join(' ').toLocaleLowerCase('pt-BR');
}
const filteredRecords = k => db[k].filter(x => searchableText(k, x).includes(query.trim().toLocaleLowerCase('pt-BR')));

function recordsHTML(k, records) {
  if (!records.length) return emptyState(query ? 'Nenhum resultado encontrado' : 'Nenhum registro por aqui', query ? 'Tente pesquisar por outro termo.' : 'Use o formulário para adicionar o primeiro cadastro.');
  return `<div class="table-wrap"><table><thead><tr>${[...configs[k].columns, 'Ações'].map(col => `<th scope="col">${col}</th>`).join('')}</tr></thead><tbody>${records.map(x => rowHTML(k, x)).join('')}</tbody></table></div>`;
}
function modulePage(k) {
  const config = configs[k];
  const record = db[k].find(x => x.id === editing);
  const missing = k === 'veiculos' && !db.clientes.length
    ? 'Antes de cadastrar um veículo, adicione pelo menos um cliente.'
    : k === 'servicos' && !db.veiculos.length
      ? 'Antes de registrar um serviço, cadastre o veículo atendido.' : '';
  const count = db[k].length;
  return heading(config.tag, config.title, config.subtitle) + `
    <div class="two-col">
      <section class="panel">
        <div class="panel-header"><div><h2>${record ? 'Editar cliente' : 'Novo ' + config.single}</h2><p>${record ? 'Altere as informações e salve.' : 'Os campos com * são obrigatórios.'}</p></div></div>
        <form id="entry-form" class="form-body" novalidate>
          ${missing ? `<div class="notice">${missing}</div>` : ''}
          ${config.fields.map(field => fieldHTML(k, field, record)).join('')}
          <div class="form-actions"><button class="btn btn-primary" type="submit" ${missing ? 'disabled' : ''}>${record ? 'Salvar alterações' : 'Cadastrar ' + config.single}</button>${record ? '<button class="btn" type="button" id="cancel-edit">Cancelar</button>' : ''}</div>
        </form>
      </section>
      <section class="panel">
        <div class="panel-header search-header"><div><h2>${config.title} cadastrados</h2><p>${count === 1 ? '1 registro' : count + ' registros'} no sistema</p></div>
          <div class="search-wrap">${icon('search')}<input class="search" id="search" type="search" placeholder="Buscar ${config.title.toLowerCase()}" value="${escapeHTML(query)}" aria-label="Buscar ${config.title.toLowerCase()}"></div>
        </div>
        <div id="records">${recordsHTML(k, filteredRecords(k))}</div>
      </section>
    </div>`;
}

function submitEntry(event) {
  event.preventDefault();
  const k = page, config = configs[k];
  const data = {};
  for (const [id] of config.fields) {
    data[id] = $('f-' + id).value.trim();
    if (!data[id]) { notify('Preencha todos os campos obrigatórios.', true); $('f-' + id).focus(); return; }
  }
  if ('telefone' in data) {
    const n = digits(data.telefone);
    if (![10, 11].includes(n.length)) { notify('Informe um telefone com DDD e 10 ou 11 dígitos.', true); $('f-telefone').focus(); return; }
    data.telefone = phone(n);
  }
  if ('placa' in data) {
    data.placa = plate(data.placa);
    if (!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(data.placa)) { notify('Placa inválida. Use ABC-1234 ou ABC-1D23.', true); $('f-placa').focus(); return; }
    if (db.veiculos.some(x => plate(x.placa) === data.placa && x.id !== editing)) { notify('Esta placa já está cadastrada.', true); $('f-placa').focus(); return; }
  }
  if ('clienteId' in data && !db.clientes.some(x => x.id === data.clienteId)) { notify('Selecione um proprietário válido.', true); return; }
  if ('veiculoId' in data && !db.veiculos.some(x => x.id === data.veiculoId)) { notify('Selecione um veículo válido.', true); return; }

  const previous = JSON.stringify(db);
  if (editing && k === 'clientes') {
    const index = db.clientes.findIndex(x => x.id === editing);
    if (index < 0) return;
    db.clientes[index] = { ...db.clientes[index], ...data };
  } else {
    db[k].push({ ...data, id: uid(), criadoEm: new Date().toISOString() });
  }
  if (!save()) { db = JSON.parse(previous); return; }
  const updated = Boolean(editing && k === 'clientes');
  editing = null;
  render();
  notify(updated ? 'Cliente atualizado com sucesso.' : config.single.charAt(0).toUpperCase() + config.single.slice(1) + ' cadastrado com sucesso.');
}
function deleteEntry(id) {
  const k = page, record = db[k].find(x => x.id === id);
  if (!record) return;
  if (k === 'clientes' && db.veiculos.some(x => x.clienteId === id)) { notify('Este cliente tem veículos vinculados. Exclua os veículos primeiro.', true); return; }
  if (k === 'veiculos' && db.servicos.some(x => x.veiculoId === id)) { notify('Este veículo tem serviços vinculados. Exclua os serviços primeiro.', true); return; }
  if (!confirm('Excluir este registro? Esta ação não pode ser desfeita.')) return;
  const previous = db[k];
  db[k] = db[k].filter(x => x.id !== id);
  if (!save()) { db[k] = previous; return; }
  if (editing === id) editing = null;
  render();
  notify('Registro excluído.');
}

function dataPage() {
  return heading('Armazenamento', 'Dados e backup', 'Faça cópias dos cadastros e restaure seus registros quando precisar.') + `
    <div class="storage-detail">${icon('check')}<div><strong>Salvamento automático ativo neste navegador</strong>As alterações ficam guardadas no armazenamento local do navegador usado. O arquivo JSON é uma cópia de segurança manual e não é atualizado automaticamente.</div></div>
    <div class="json-grid">
      ${panel('Exportar dados', 'Guarde uma cópia dos registros', `<div class="json-box"><h3>Baixar arquivo JSON</h3><p>Gere um arquivo com os cadastros de clientes, veículos, serviços e funcionários.</p><button type="button" class="btn btn-primary" id="export-json">${icon('download')} Exportar JSON</button></div>`)}
      ${panel('Importar dados', 'Recupere os cadastros de um backup', `<div class="json-box"><h3>Restaurar arquivo JSON</h3><p>Escolha um backup do AutoGestão. Os registros atuais serão substituídos após confirmação.</p><label class="field" for="import-file">Selecione o arquivo (.json)</label><input id="import-file" type="file" accept=".json,application/json"><button type="button" class="btn" id="import-json">${icon('upload')} Importar JSON</button></div>`)}
    </div>
    <section class="panel" style="margin-top: 20px"><div class="danger-zone"><div><strong>Apagar os dados deste navegador</strong><p>Essa operação remove todos os cadastros locais. Exporte um backup antes, se precisar manter as informações.</p></div><button type="button" class="btn btn-danger" id="clear-data">Apagar registros</button></div></section>`;
}
function exportJSON() {
  const data = { aplicacao: 'AutoGestao', versao: 1, exportadoEm: new Date().toISOString(), ...db };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'autogestao-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notify('Arquivo JSON exportado.');
}
function validateImport(input) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) throw Error('Formato inválido.');
  const keys = Object.keys(empty());
  if (!keys.every(k => Array.isArray(input[k]))) throw Error('O arquivo precisa conter as listas de clientes, veículos, serviços e funcionários.');
  const required = {
    clientes: ['id', 'nome', 'telefone', 'endereco'],
    veiculos: ['id', 'marca', 'modelo', 'placa', 'clienteId'],
    servicos: ['id', 'descricao', 'veiculoId'],
    funcionarios: ['id', 'nome', 'telefone', 'funcao']
  };
  for (const k of keys) {
    if (input[k].length > 10000) throw Error('O arquivo contém registros demais.');
    const ids = new Set();
    for (const item of input[k]) {
      if (!item || typeof item !== 'object' || !required[k].every(f => typeof item[f] === 'string' && item[f].trim() && item[f].length <= 1000)) throw Error('Registro inválido em ' + k + '.');
      if (ids.has(item.id)) throw Error('Identificador duplicado em ' + k + '.');
      ids.add(item.id);
    }
  }
  const clients = new Set(input.clientes.map(x => x.id));
  const vehicles = new Set(input.veiculos.map(x => x.id));
  if (input.veiculos.some(x => !clients.has(x.clienteId)) || input.servicos.some(x => !vehicles.has(x.veiculoId))) throw Error('Existem vínculos inválidos entre clientes, veículos e serviços.');
  return Object.fromEntries(keys.map(k => [k, input[k].map(x => ({ ...x }))]));
}
async function importJSON() {
  const file = $('import-file').files[0];
  if (!file) { notify('Escolha um arquivo JSON.', true); return; }
  if (file.size > 5 * 1024 * 1024) { notify('O arquivo deve ter no máximo 5 MB.', true); return; }
  try {
    const incoming = validateImport(JSON.parse(await file.text()));
    if (!confirm('Importar este arquivo? Os cadastros atuais serão substituídos.')) return;
    const previous = db;
    db = incoming;
    if (!save()) { db = previous; return; }
    go('inicio');
    notify('Backup importado com sucesso.');
  } catch (error) {
    notify('Não foi possível importar: ' + error.message, true);
  }
}
function render() {
  const content = $('content');
  content.innerHTML = page === 'inicio' ? home() : page === 'dados' ? dataPage() : modulePage(page);
  if (configs[page]) {
    const k = page;
    $('entry-form').addEventListener('submit', submitEntry);
    $('search').addEventListener('input', event => {
      query = event.target.value;
      $('records').innerHTML = recordsHTML(k, filteredRecords(k));
    });
    $('records').addEventListener('click', event => {
      const edit = event.target.closest('[data-edit]');
      const deletion = event.target.closest('[data-delete]');
      if (edit) {
        editing = edit.dataset.edit;
        render();
        $('entry-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
        $('f-nome')?.focus({ preventScroll: true });
      }
      if (deletion) deleteEntry(deletion.dataset.delete);
    });
    $('cancel-edit')?.addEventListener('click', () => { editing = null; render(); });
  }
  if (page === 'inicio') content.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => go(button.dataset.go)));
  if (page === 'dados') {
    $('export-json').addEventListener('click', exportJSON);
    $('import-json').addEventListener('click', importJSON);
    $('clear-data').addEventListener('click', () => {
      if (!confirm('Tem certeza que deseja apagar todos os cadastros?')) return;
      if (!confirm('Confirme a exclusão. Os dados não poderão ser recuperados sem um backup.')) return;
      const previous = db;
      db = empty();
      if (!save()) { db = previous; return; }
      render();
      notify('Todos os registros foram removidos.');
    });
  }
}

$('nav').addEventListener('click', event => {
  const button = event.target.closest('[data-page]');
  if (button) go(button.dataset.page);
});
$('menu-toggle').addEventListener('click', () => {
  const open = !$('sidebar').classList.contains('open');
  $('sidebar').classList.toggle('open', open);
  $('menu-backdrop').classList.toggle('open', open);
  $('menu-toggle').setAttribute('aria-expanded', String(open));
});
$('menu-backdrop').addEventListener('click', closeMenu);
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });
$('today').textContent = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }).format(new Date());
render();

</script>
